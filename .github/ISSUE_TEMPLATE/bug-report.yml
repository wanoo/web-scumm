name: Bug report
description: Report a reproducible engine, Studio or game problem
title: "[bug] "
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the selected GAME, browser, exact commands and smallest sequence of actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: session
    attributes:
      label: Exported session or save
      description: Attach the JSON exported by the pause menu after removing private content. Never paste API keys.
  - type: textarea
    id: checks
    attributes:
      label: Diagnostic output
      description: Paste `npm run doctor`, `npm run validate`, and the relevant solver status.
