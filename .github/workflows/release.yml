name: release
# A SemVer tag (vMAJOR.MINOR.PATCH[-pre], any major) publishes the GitHub release only once the `ci` workflow of that tag is
# green (check, the browser e2e rows): this workflow runs on ci's completion, not on the tag push. It builds the very
# commit ci tested (`head_sha`), and refuses a tag that no longer points there (moved since). It then re-runs the
# release checks (doctor --release, build, coverage and its strict ratchet, proof, strict playtests, the mutation sets, the
# packages' publish dry run, dependency audits, the dist inventory) and creates the
# release with the matching CHANGELOG section and the manual passes of docs/dev/passes/. Attached: the built game
# (dist, its licences inside), its assets manifest, the engine's npm packages (web-scumm, create-web-scumm, 3.9;
# web-scumm-bridge, 4.1.1),
# SHA-256 sums, an SBOM of the shipped dependencies (CycloneDX) and
# a build provenance attestation (`gh attestation verify <file> -R wanoo/web-scumm`), and reads it all back once published
# (`ship verify`, 4.1.8). A release that already has
# files is never overwritten (3.7.1): a new version is a new tag.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && contains(github.event.workflow_run.head_branch, '.')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: A SemVer tag
        run: |
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' || { echo "::notice::$TAG is not a release tag"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: The tag is the commit ci tested
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA" || { echo "::error::$TAG points to $(git rev-parse "refs/tags/$TAG^{commit}"), ci tested $SHA"; exit 1; }
      - name: Not published yet
        run: |
          n=$(gh release view "$TAG" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          test "$n" = 0 || { echo "::error::$TAG already has $n file(s): a published release is never replaced"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      # `npm run doctor -- --release` (first step of release-check) requires ffmpeg and the three browsers (4.1.8).
      - run: for i in 1 2 3; do (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: for i in 1 2 3; do (npx playwright install --with-deps chromium firefox webkit) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      # The mutation report of these very inputs, measured by ci (4.1.8): release-check reuses it, or runs both sets.
      - id: inputs
        run: echo "hash=$(npx tsx tools/mutate.ts --set=all --hash)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mutation
          key: mutation-all-${{ steps.inputs.outputs.hash }}
      - run: npm run release-check
      - run: node scripts/release-notes.mjs "$TAG" > notes.md
      - name: Build archive, checksum and SBOM
        run: |
          tar -czf "web-scumm-$TAG-dist.tar.gz" -C dist .
          cp dist/licenses/assets-manifest.json "web-scumm-$TAG-assets-manifest.json"
          npm sbom --sbom-format cyclonedx --omit dev > "web-scumm-$TAG-sbom.cdx.json"
          # The engine as packages (3.9): what `npm install <tarball>` and `npx create-web-scumm` take.
          node scripts/pack.mjs --out=pack
          cp pack/web-scumm-*.tgz pack/create-web-scumm-*.tgz .
          # The reference Reality Bridge (4.1.1): web-scumm-bridge-<version>.tgz, its own package, with its own SBOM
          # (4.1.2): the root's SBOM lists the engine's runtime dependencies, not the Bridge's.
          # `npm sbom` reads the installed tree, not a lockfile: a real install of the package's two dependencies.
          (cd pack/web-scumm-bridge && npm install --omit=dev --ignore-scripts --no-audit --no-fund >/dev/null && npm sbom --sbom-format cyclonedx --omit dev) > "web-scumm-bridge-$TAG-sbom.cdx.json"
          sha256sum "web-scumm-$TAG-dist.tar.gz" "web-scumm-$TAG-assets-manifest.json" "web-scumm-$TAG-sbom.cdx.json" "web-scumm-bridge-$TAG-sbom.cdx.json" web-scumm-[0-9]*.tgz create-web-scumm-*.tgz web-scumm-bridge-*.tgz > "web-scumm-$TAG-SHA256SUMS"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          # Every file the release carries (4.1.2): the archives and packages, the manifests, both SBOMs, the sums.
          subject-path: |
            web-scumm-${{ env.TAG }}-dist.tar.gz
            web-scumm-${{ env.TAG }}-assets-manifest.json
            web-scumm-${{ env.TAG }}-sbom.cdx.json
            web-scumm-bridge-${{ env.TAG }}-sbom.cdx.json
            web-scumm-${{ env.TAG }}-SHA256SUMS
            web-scumm-[0-9]*.tgz
            create-web-scumm-*.tgz
            web-scumm-bridge-*.tgz
      - run: |
          # A pre-release tag (`v4.1.8-rc.1`, 4.1.8) is published as a GitHub pre-release: same files, same checks.
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file notes.md $pre
          gh release upload "$TAG" "web-scumm-$TAG-dist.tar.gz" "web-scumm-$TAG-assets-manifest.json" "web-scumm-$TAG-sbom.cdx.json" "web-scumm-bridge-$TAG-sbom.cdx.json" web-scumm-[0-9]*.tgz create-web-scumm-*.tgz web-scumm-bridge-*.tgz "web-scumm-$TAG-SHA256SUMS"
        env:
          GH_TOKEN: ${{ github.token }}
      # What was published, read back (4.1.8): every file downloaded, the sums checked, every attestation verified.
      - run: node tools/release/ship.mjs verify "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
