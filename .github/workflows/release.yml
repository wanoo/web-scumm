name: release
# A tag v3.x.y publishes the GitHub release only once the `ci` workflow of that tag is green (check, the browser e2e
# rows): this workflow runs on ci's completion, not on the tag push. It then re-runs the release checks (doctor,
# build, proof, strict playtests, dependency audits) and creates the release with the matching CHANGELOG section and
# the manual passes of docs/dev/passes/. Attached: the built game (dist), its SHA-256, an SBOM of the shipped
# dependencies (CycloneDX) and a build provenance attestation (`gh attestation verify <file> -R wanoo/web-scumm`).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v3.')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # `npm run doctor` (first step of release-check) requires ffmpeg: the audio pipeline's prerequisite.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run release-check
      - run: node scripts/release-notes.mjs "$TAG" > notes.md
      - name: Build archive, checksum and SBOM
        run: |
          tar -czf "web-scumm-$TAG-dist.tar.gz" -C dist .
          npm sbom --sbom-format cyclonedx --omit dev > "web-scumm-$TAG-sbom.cdx.json"
          sha256sum "web-scumm-$TAG-dist.tar.gz" "web-scumm-$TAG-sbom.cdx.json" > "web-scumm-$TAG-SHA256SUMS"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: web-scumm-${{ env.TAG }}-dist.tar.gz
      - run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" --clobber "web-scumm-$TAG-dist.tar.gz" "web-scumm-$TAG-sbom.cdx.json" "web-scumm-$TAG-SHA256SUMS"
        env:
          GH_TOKEN: ${{ github.token }}
