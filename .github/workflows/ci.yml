name: ci
on:
  push:
    # main deploys to Pages; the v3 integration and topic branches only run the checks (docs/dev/CHARTER.md).
    branches: [main, v3, 'v3-*']
    tags: ['v*']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npm run audit:deps
      # Rebuild with the Studio demo entry for Pages after the complete release checks passed.
      - run: npm run build:web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          STUDIO: '1'
          VITE_STUDIO_DEMO: '1'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  # The production bundle played by touch. Chromium runs the complete game-specific walkthrough and gates the
  # deploy; WebKit runs the generic solver session as a cross-engine smoke test, experimental (non-blocking) until
  # three consecutive green runs on main, then `experimental: false` (docs/dev/DECISIONS.md D7).
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mode: full
            experimental: false
          - browser: webkit
            mode: generic
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build:web
      - run: npm run preview -- --port 5173 &
      - run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
      - run: npm run e2e -- http://127.0.0.1:5173/ --game demo --prod ${{ matrix.mode == 'generic' && '--generic' || '' }}
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_OUT: /tmp/e2e-${{ matrix.browser }}
      - run: npm run e2e:pwa -- http://127.0.0.1:5173/
        env:
          E2E_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.browser }}
          path: /tmp/e2e-${{ matrix.browser }}
  pages:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
