name: ci
on:
  push:
    # main deploys to Pages; the v3 integration and topic branches only run the checks (docs/dev/CHARTER.md).
    branches: [main, v3, 'v3-*']
    tags: ['v*']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run audit
      - run: npm run validate
      - run: npm run solve
      - run: npm test
      # The game, plus the Studio in demo mode at studio.html (docs/en/STUDIO.md, "Demo mode").
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          STUDIO: '1'
          VITE_STUDIO_DEMO: '1'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  # The sample game played by touch in Chromium: the solver's solution replayed step by step, the minigames for real
  # (games/demo/e2e.mjs). Separate from `check`: the Pages deploy does not wait for it.
  e2e:
    runs-on: ubuntu-latest
    # Playwright taps on a shared runner can be flaky: this job reports, it does not block (see docs/en/TOOLS.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run dev -- --port 5173 --host 127.0.0.1 &
      - run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
      - run: npm run e2e -- http://127.0.0.1:5173/ --game demo
        env:
          E2E_OUT: /tmp/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: /tmp/e2e
  pages:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
