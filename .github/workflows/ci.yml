name: ci
on:
  push:
    # main deploys to Pages; topic branches only run the checks (docs/dev/CHARTER.md). Since 3.7.1 a topic branch is
    # named by its kind, whatever the version: feature/…, fix/…, release/…, docs/…, test/…, refactor/… ('v[0-9]*' keeps the older v37-… names).
    branches: [main, 'feature/**', 'fix/**', 'release/**', 'docs/**', 'test/**', 'refactor/**', 'v[0-9]*']
    tags: ['v*']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm ci
      # Formatting, code lint, both TypeScript configurations, content lint (4.1.0 "Clarity").
      - run: npm run quality
      # validate --release measures the stems with ffprobe (3.6).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run build
      # The weight budget with the app shell of this fresh build (the Node test weighs the game's assets only).
      - run: npm run weight -- --release
      # The behaviour of 4.0.0 frozen (4.1.0 "Clarity"): the same witnesses, proofs, golden saves, public surface, and a
      # first visit no bigger, whatever a refactoring moved (tools/quality-baseline.ts).
      - run: npm run quality:baseline -- --check --dist
      # The exhaustive proof of the sample game (seconds); a big game proves on the weekly prove workflow instead.
      - run: npm run prove:game
      - run: npm run audit:deps
      # Rebuild with the Studio demo entry for Pages after the complete release checks passed.
      - run: npm run build:web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          STUDIO: '1'
          VITE_STUDIO_DEMO: '1'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  # A second game, as `npm run new-game` makes it: every gate the sample game passes (check, verify:game, prove:game,
  # the build, the production e2e with axe and saves), without a single test written for it. A gate since 3.2.
  # Biscuit's official samples in the JavaScript build the Bridge runs and in the Rust crate (4.1.1, D16): the same
  # verdict as the specification in both. The runner image has cargo.
  reality-xcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run reality:xcheck -- --require-rust
  # Reality Bridge end to end (4.1.1, scripts/e2e-reality.mjs): the sample game games/signals built for production, a
  # reference Bridge, pairing from the pause menu, the same webhook twice, offline then online, applied once, the
  # session replayed with the Bridge stopped. WebKit cannot reopen offline under automation (as e2e:pwa).
  reality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run assets
        env:
          GAME: signals
      - run: npx vite build
        env:
          GAME: signals
      - run: npm run solve:reality
        env:
          GAME: signals
      - run: npx vite preview --port 5176 --strictPort &
        env:
          GAME: signals
      - run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5176/ > /dev/null && break; sleep 1; done
      - run: npm run e2e:reality -- http://127.0.0.1:5176/ --browser=${{ matrix.browser }} ${{ matrix.browser == 'webkit' && '--allow-skip' || '' }}
  second-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run new-game second "Second Game"
      - run: npm run assets
      # validate --release measures the stems with ffprobe (3.6).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run build
        env:
          GAME: second
      - run: npm run prove:game
        env:
          GAME: second
      - run: npm run preview -- --port 5174 &
        env:
          GAME: second
      - run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5174/ > /dev/null && break; sleep 1; done
      - run: npm run e2e -- http://127.0.0.1:5174/ --game second --prod --generic --axe --save
        env:
          GAME: second
  # The production bundle played by touch. Chromium runs the complete game-specific walkthrough and WebKit the
  # generic solver session; both gate the deploy (WebKit after three consecutive green runs on main, D7). The keyboard
  # row gates too since 3.2; WebKit at the keyboard and the French row since 3.3.1 (green on every run of 3.3, D7).
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mode: full
            experimental: false
          - browser: webkit
            mode: generic
            experimental: false
          # The whole game at the keyboard (verbs, targets, choices, the map, Space to advance a line), axe-core on
          # four screens: a gate since 3.2 (green on every run of 3.1.1 and 3.2, D7's rule).
          - browser: chromium
            mode: keyboard
            experimental: false
          - browser: webkit
            mode: keyboard
            experimental: false
          # The release language: the whole game in French, no English default of the engine visible.
          - browser: chromium
            mode: fr
            experimental: false
          # The Canvas painter (D10, since 3.4): the whole game drawn by it, its rooms against the DOM references, the
          # frame rate with the CPU slowed 4×.
          - browser: chromium
            mode: canvas
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # The same two-entry build Pages deploys (game + Studio demo): a chunk the game needs but the worker does not
      # precache only shows up in that shape.
      - run: npm run build:web
        env:
          STUDIO: '1'
          VITE_STUDIO_DEMO: '1'
      - run: npm run preview -- --port 5173 &
      - run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
      - run: npm run e2e -- http://127.0.0.1:5173/ --game demo --prod ${{ matrix.mode == 'generic' && '--generic' || matrix.mode == 'keyboard' && '--generic --keyboard --save --no-indexeddb --axe' || matrix.mode == 'fr' && '--generic --lang fr' || matrix.mode == 'canvas' && '--generic --renderer canvas' || '--save --axe' }}
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_OUT: /tmp/e2e-${{ matrix.browser }}
      # The weight budget against the bytes really transferred (since 3.4): a first visit with the warm-ups off, every
      # request inside the asset graph's prediction, the total within 10% of it.
      - run: npm run e2e:weight -- http://127.0.0.1:5173/
        if: matrix.browser == 'chromium' && matrix.mode == 'full'
      # The music director (since 3.5): thirty minutes rendered offline without a sample of drift, 100 changes of mix
      # without a click, the theme's stems in the game; then each browser's real-time jitter (< 20 ms).
      - run: npm run e2e:music -- http://127.0.0.1:5173/ --only=offline && npm run e2e:music -- http://127.0.0.1:5173/ --only=game && npm run e2e:music -- http://127.0.0.1:5173/ --only=live --live=chromium
        if: matrix.browser == 'chromium' && matrix.mode == 'full'
      - run: npm run e2e:music -- http://127.0.0.1:5173/ --only=live --live=webkit
        if: matrix.browser == 'webkit' && matrix.mode == 'generic'
      # Visual baselines (since 3.4): every room of the sample game, still, against tests/visual/demo/*.png.
      - run: npm run e2e:visual -- http://127.0.0.1:5173/
        if: matrix.browser == 'chromium' && matrix.mode == 'full'
      - run: npm run e2e:visual -- http://127.0.0.1:5173/ --renderer=canvas
        if: matrix.mode == 'canvas'
      - run: npm run e2e:perf -- http://127.0.0.1:5173/ --renderer=canvas && npm run e2e:perf -- http://127.0.0.1:5173/ --renderer=dom
        if: matrix.mode == 'canvas'
      # The Studio edits a stage without JSON by hand (since 3.4): on its dev server, the Stage form, the diff, the
      # write, the game sees it, undo puts the file back.
      - run: STUDIO=1 npx vite --port 5317 --strictPort &
        if: matrix.mode == 'canvas'
      - run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5317/__studio/ > /dev/null && break; sleep 1; done && npm run e2e:studio -- http://127.0.0.1:5317/__studio/
        if: matrix.mode == 'canvas'
      # The accessibility and storage gates (since 3.3): axe on the conversation menu, the map, the save / load slots,
      # the confirmations and every built-in minigame; every minigame won at the keyboard; an older save (v2
      # localStorage, a 3.1.0 IndexedDB record) upgraded and resumed. Blocking in Chromium (keyboard row) and WebKit.
      - run: npm run e2e:a11y -- http://127.0.0.1:5173/
        if: (matrix.browser == 'chromium' && matrix.mode == 'keyboard') || (matrix.browser == 'webkit' && matrix.mode == 'generic')
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_OUT: /tmp/e2e-${{ matrix.browser }}/a11y
      # Chromium proves the offline game (every file of the plan in the cache). WebKit cannot navigate offline under
      # Playwright: its run reports "skipped", accepted here, never counted as a proof; a person checks Safari offline
      # before each release (docs/dev/SAFARI-OFFLINE.md, the result in docs/dev/passes/).
      - run: npm run e2e:pwa -- http://127.0.0.1:5173/ ${{ matrix.browser == 'webkit' && '--allow-skip' || '' }}
        env:
          E2E_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.browser }}-${{ matrix.mode }}
          path: |
            /tmp/e2e-${{ matrix.browser }}
            tests/visual
  # The engine as another project uses it (3.9): packed, a game created from the template outside the repository,
  # installed from the tarball, verified, built and played to its ending (scripts/fresh-install.mjs).
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run fresh-install

  # A game made on the previous release moved to this engine (4.0): created with that release's tarball, a save made by
  # it, then this engine installed, migrate --check, verify, build, and the old save played to the end.
  upgrade:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run upgrade-check -- --from=previous

  # The reference chapter (games/reference, since 3.4): the second real game, the 3.4 exit gate. Built, proved whole and
  # chapter by chapter, played to the end at the keyboard in Chromium and WebKit, in French with no English default
  # visible; its rooms against their references, its staged market at 30 fps or more with the CPU slowed 4×, its first
  # visit inside the weight prediction.
  reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      GAME: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # validate --release measures the stems with ffprobe (3.6).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run build
      - run: npm run prove:game
        if: matrix.browser == 'chromium'
      - run: npm run preview -- --port 5175 &
      - run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5175/ > /dev/null && break; sleep 1; done
      - run: npm run e2e -- http://127.0.0.1:5175/ --game reference --prod --keyboard
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_OUT: /tmp/e2e-reference-${{ matrix.browser }}
      - run: npm run e2e -- http://127.0.0.1:5175/ --game reference --prod --lang fr && npm run e2e -- http://127.0.0.1:5175/ --game reference --prod --generic --axe --save
        if: matrix.browser == 'chromium'
        env:
          E2E_OUT: /tmp/e2e-reference-fr
      - run: npm run e2e:visual -- http://127.0.0.1:5175/ && npm run e2e:perf -- http://127.0.0.1:5175/ && npm run e2e:weight -- http://127.0.0.1:5175/
        if: matrix.browser == 'chromium'
      # Two scores and two bridges (3.7): a transition planned, restored, stopped, under transitionPeakMB; in WebKit
      # too since 3.8.
      - run: npm run e2e:music -- http://127.0.0.1:5175/ --only=reference --browser=${{ matrix.browser }}
      # The default verb (4.0): a double tap goes through a door, talks to a character; an item from the bag is given or used.
      - run: npm run e2e:taps -- http://127.0.0.1:5175/ --browser=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-reference-${{ matrix.browser }}
          path: /tmp/e2e-reference-*
  pages:
    needs: [check, e2e, second-game, reference]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
