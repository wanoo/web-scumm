name: nightly
# The abstractions against the explicit search on 500 random games of each kind (3.6, tools/audit-corpus.ts), in four
# shards since 3.7: too slow for every push. A divergence fails the run; it is a solver bug to fix before the next
# release.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'How many seeds'
        default: '500'
permissions:
  contents: read
jobs:
  # The heavy solver tests (4.1.3): the abstraction audits, the canonical owner, the memo and the ownership proofs, the
  # reference chapter's proof. Minutes each on a shared runner, so they run here every night, not on every push.
  heavy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:heavy
  # Four shards of the seeds, one per job (3.7): the corpus is parallel by seed, the jobs run side by side.
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # bash -o pipefail: a divergence still fails the job through tee.
      - shell: bash
        run: |
          # The seeds of this shard: tools/audit-corpus.ts splits the total evenly, never past it (3.7.1).
          npm run audit:corpus -- --shard=${{ matrix.shard }}/4 --total=${{ github.event.inputs.seeds || '500' }} --json=corpus-${{ matrix.shard }}.json | tee corpus-${{ matrix.shard }}.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus-${{ matrix.shard }}
          path: corpus-${{ matrix.shard }}.*
          if-no-files-found: ignore
  # The shards added up: tried, compared, partial and diverged per kind, kept as an artifact and on the run's page. A
  # missing shard, or seeds run twice, fails it (3.7.1).
  merge:
    needs: corpus
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: corpus-*
          merge-multiple: true
      - shell: bash
        run: npx tsx tools/audit-corpus.ts --merge corpus-*.json --total=${{ github.event.inputs.seeds || '500' }} --json=corpus.json | tee corpus.txt
      - if: always()
        shell: bash
        run: |
          if [ -f corpus.txt ]; then { echo '```'; cat corpus.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus
          path: |
            corpus.json
            corpus.txt
          if-no-files-found: ignore
  # Mutation testing of the critical core (4.1.0, tools/mutate.ts): every mutant of conditions, saves, sessions and
  # migrations killed by a test, or one of the equivalent mutants docs/dev/MUTANTS.md explains. The report is kept.
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutation:core -- --set=core | tee mutation.txt
        shell: bash
      # What a signal from the world outside rests on (4.1.2), judged by the Reality and Bridge tests. Measured, not
      # yet gating: docs/dev/MUTANTS.md says how many of its mutants survive unexplained; the job goes red for them
      # once that count is zero (remove `continue-on-error` then).
      - run: npm run test:mutation:core -- --set=reality | tee mutation-reality.txt
        shell: bash
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation
          path: |
            mutation.txt
            mutation-reality.txt
            .cache/mutation/report-*.json
          if-no-files-found: ignore
