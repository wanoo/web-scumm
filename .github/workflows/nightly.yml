name: nightly
# The abstractions against the explicit search on 500 random games of each kind (3.6, tools/audit-corpus.ts): too
# slow for every push. A divergence fails the run; it is a solver bug to fix before the next release.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'How many seeds'
        default: '500'
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # bash -o pipefail: a divergence still fails the run through tee.
      - shell: bash
        run: npm run audit:corpus -- --seeds=${{ github.event.inputs.seeds || '500' }} --json=corpus.json | tee corpus.txt
      # The counts (tried, compared, partial, diverged per kind) kept with the run, and shown on its page (3.6.1).
      - if: always()
        shell: bash
        run: |
          if [ -f corpus.txt ]; then { echo '```'; cat corpus.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: |
            corpus.json
            corpus.txt
          if-no-files-found: ignore
