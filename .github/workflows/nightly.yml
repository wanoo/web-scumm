name: nightly
# The abstractions against the explicit search on 500 random games of each kind (3.6, tools/audit-corpus.ts), in four
# shards since 3.7: too slow for every push. A divergence fails the run; it is a solver bug to fix before the next
# release.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'How many seeds'
        default: '500'
permissions:
  contents: read
jobs:
  # The heavy solver tests (4.1.3): the abstraction audits, the canonical owner, the memo and the ownership proofs, the
  # reference chapter's proof. Minutes each on a shared runner, so they run here every night, not on every push.
  heavy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: npm run test:heavy
  # The connectors' fuzz harness (4.1.9, tools/fuzz-connectors.ts): seeded mutations for a minute per
  # connector, a new seed each night (the run number). Reported, not gating, until it has been green two nights in a
  # row (plan 4.1.9 §4 branch 6); then `continue-on-error` goes.
  fuzz-connectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: node --expose-gc --import tsx tools/fuzz-connectors.ts --cases=1000000 --seconds=60 --seed=${{ github.run_number }}
  # Four shards of the seeds, one per job (3.7): the corpus is parallel by seed, the jobs run side by side.
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      # bash -o pipefail: a divergence still fails the job through tee.
      - shell: bash
        run: |
          # The seeds of this shard: tools/audit-corpus.ts splits the total evenly, never past it (3.7.1).
          npm run audit:corpus -- --shard=${{ matrix.shard }}/4 --total=${{ github.event.inputs.seeds || '500' }} --json=corpus-${{ matrix.shard }}.json | tee corpus-${{ matrix.shard }}.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus-${{ matrix.shard }}
          path: corpus-${{ matrix.shard }}.*
          if-no-files-found: ignore
  # The shards added up: tried, compared, partial and diverged per kind, kept as an artifact and on the run's page. A
  # missing shard, or seeds run twice, fails it (3.7.1).
  merge:
    needs: corpus
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: corpus-*
          merge-multiple: true
      - shell: bash
        run: npx tsx tools/audit-corpus.ts --merge corpus-*.json --total=${{ github.event.inputs.seeds || '500' }} --json=corpus.json | tee corpus.txt
      - if: always()
        shell: bash
        run: |
          if [ -f corpus.txt ]; then { echo '```'; cat corpus.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus
          path: |
            corpus.json
            corpus.txt
          if-no-files-found: ignore
  # Mutation testing of both sets (4.1.0, tools/mutate.ts; the Reality set gated since 4.1.8): every mutant killed by
  # a test, or one of the equivalent mutants docs/dev/mutants.json names. The report is kept.
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      # Both sets, gated (4.1.8): a survivor not named in docs/dev/mutants.json is red here too. `--fresh`: the
      # nightly measures again whatever ci cached, so a flaky kill does not hide behind a reused report.
      - run: npm run test:mutation:core -- --set=all --fresh | tee mutation.txt
        shell: bash
      # The Bridge's stores and fan-out (4.1.10): measured every night, not gated yet (tools/mutation-sets.ts, GATED).
      - if: always()
        continue-on-error: true
        run: npm run test:mutation:core -- --set=reality-store --fresh | tee mutation-reality-store.txt
        shell: bash
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation
          path: |
            mutation.txt
            mutation-reality-store.txt
            .cache/mutation/report-*.json
          if-no-files-found: ignore
  # The Bridge under load (4.1.10, tools/bridge-load.ts, docs/dev/BENCH-BRIDGE.md): three instances, 1 000 players,
  # 50 000 proposals, on SQLite and on Postgres 16 (a service container pinned by digest). The report is kept; a lost
  # or doubled signal, a gap in a sequence or an incomplete stream fails the run.
  bridge-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        store: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: npm run bridge:load -- --out=bridge-load-${{ matrix.store }}.json
        env:
          BRIDGE_STORE: ${{ matrix.store == 'postgres' && 'postgres://bridge:bridge@127.0.0.1:5432/bridge' || '' }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bridge-load-${{ matrix.store }}
          path: bridge-load-${{ matrix.store }}.json
          if-no-files-found: ignore
  # The proof matrix of 4.1.13 (docs/dev/PROOF-MATRIX.md, tools/prove-matrix.ts): each of the twelve instances proved
  # in its own job under the runner's budget (20 min, 10 000 000 states, 4 GB of heap). A false verdict fails the job;
  # an instance out of budget is `unknown`, the gap report, not a failure. Never on a pull request.
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        instance: [c11, c12, c13, c14, c15, c16, o21, o22, o23, o24, o25, o26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - shell: bash
        run: npm run prove:matrix -- --only=${{ matrix.instance }} --time=1200 --mem=4096 --json=matrix-${{ matrix.instance }}.json --profile=profile-${{ matrix.instance }}.md | tee matrix-${{ matrix.instance }}.txt
      - if: always()
        shell: bash
        run: |
          if [ -f matrix-${{ matrix.instance }}.txt ]; then { echo '```'; cat matrix-${{ matrix.instance }}.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: matrix-${{ matrix.instance }}
          path: |
            matrix-${{ matrix.instance }}.*
            profile-${{ matrix.instance }}.md
          if-no-files-found: ignore
